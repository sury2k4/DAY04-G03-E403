tools:
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc (như handle tài khoản, URL) hoặc khi cần xác nhận trước hành động gửi tin nhắn."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' khi xin thêm thông tin, 'yes_no' khi xin xác nhận đồng ý"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây CỦA một tài khoản/người dùng cụ thể trên mạng xã hội."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (handle) không chứa @" }
        limit: {type: integer, default: 5, description: "Số lượng bài viết cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng trên mạng xã hội (Twitter) theo CHỦ ĐỀ hoặc TỪ KHÓA."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cần tìm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: 'Latest' cho mới nhất, 'Top' cho phổ biến nhất"}
        limit: {type: integer, default: 5, description: "Số lượng kết quả"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin, tin tức thời sự trên web nói chung."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn tìm kiếm"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: 'news' cho tin tức báo chí/thời sự, 'general' cho tìm kiếm chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay, 'week' cho tuần này"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung chi tiết từ một đường dẫn URL cụ thể (http:// hoặc https://)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL của bài viết"}
      required: [url]

  - name: format
    description: "Trình bày các thông tin đã thu thập được thành bản tổng hợp (digest) bằng Markdown."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách thông tin đã thu thập"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu trình bày"}
        headline: {type: string, default: "", description: "Tiêu đề bản tin"}
      required: [items, template]

  - name: crypto_price
    description: "Tra cứu giá tiền điện tử (Cryptocurrency) theo thời gian thực (BTC, ETH, SOL,...)."
    parameters:
      type: object
      properties:
        symbol: {type: string, default: "btc", description: "Mã đồng coin (ví dụ: btc, eth, sol)"}
        currency: {type: string, default: "usd", description: "Đơn vị tiền tệ (ví dụ: usd, eur, vnd)"}
      required: [symbol]

  - name: send
    description: "Gửi thông điệp/bản tin lên Telegram channel. Chỉ thực hiện khi người dùng đã xác nhận."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận của người dùng"}
      required: [text]

  - name: policy
    description: "Tìm kiếm trong quy định và chính sách nội bộ của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn tìm kiếm"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm quy định"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm kiếm bài báo khoa học trên arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Cách sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải và trích xuất văn bản từ file PDF bài báo arXiv."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID bài báo arXiv (ví dụ 1706.03762) hoặc URL"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]
